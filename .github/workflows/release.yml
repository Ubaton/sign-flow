name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Validate NPM publish credentials
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "error: NPM_TOKEN secret is not set. Set NPM_TOKEN with publish access to signflow-core and signflow."
            exit 1
          fi

      - run: npm run build --workspace=signflow-core --workspace=signflow

      # On every push to main: if there are pending changesets, opens/updates
      # a "Version Packages" PR. Once that PR is merged (which contains no
      # more changesets), this step publishes the bumped packages to npm.
      #
      # The PR half needs a repo setting that the `permissions:` block above
      # cannot grant: Settings → Actions → General → Workflow permissions →
      # "Allow GitHub Actions to create and approve pull requests". Without it
      # this step fails with "GitHub Actions is not permitted to create or
      # approve pull requests" once a changeset is pending.
      #
      # Alternative if you'd rather not enable it: run `npx changeset version`
      # locally and commit the result. With no changesets left on main, this
      # step skips PR creation entirely and goes straight to publishing.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          publish: npx changeset publish --ignore signflow --ignore @ubaton-ray/api --ignore @ubaton-ray/docs
          version: npm run version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
